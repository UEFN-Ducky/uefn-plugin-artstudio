<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Art Studio</title>
  <script src="../../_kit/ducky.js"></script>
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/feedback.css">
</head>
<body class="dk-page studio">
  <header class="studio__bar">
    <nav data-panel="menu" class="studio__menu" aria-label="Menu"></nav>
    <button class="studio__project" data-project-menu title="Project: switch, create, rename or delete" aria-haspopup="menu"><span data-project-name>Project</span><span aria-hidden="true">▾</span></button>
    <div class="studio__doctabs" data-doc-tabs role="tablist" aria-label="Canvases in this project"></div>
    <button class="studio__newtab" data-act="new" title="New artwork (Ctrl+N)" aria-label="New artwork">+</button>
    <button class="studio__cmd" data-act="palette" title="All commands and settings (Ctrl+K)" aria-label="All commands and settings">⌘ Commands</button>
  </header>

  <main class="studio__body">
    <aside class="dk-card studio__tools" aria-label="Tools">
      <section data-panel="toolbar"></section>
    </aside>

    <div class="studio__stage">
      <section data-panel="canvas" class="studio__canvas"></section>
      <div class="studio__state" data-state hidden></div>
    </div>

    <aside class="dk-card studio__dock" data-dock aria-label="Panels">
      <div class="studio__resize" data-dock-resize tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize dock"></div>
      <button class="dk-btn studio__dock-toggle" data-dock-toggle title="Collapse or expand the dock" aria-label="Collapse dock">⇥</button>

      <section class="studio__pgroup" data-dock-group="color">
        <nav class="studio__tabs" role="tablist" aria-label="Color">
          <button class="dk-pill" role="tab" data-tab="color" title="Color"><span class="ic">●</span><span class="lb">Color</span></button>
          <button class="dk-pill" role="tab" data-tab="swatches" title="Swatches"><span class="ic">▦</span><span class="lb">Swatches</span></button>
          <button class="dk-btn studio__gmenu" data-group-menu="color" title="Panel menu" aria-label="Color panel menu">⋮</button>
          <button class="dk-btn studio__gtoggle" data-group-toggle title="Collapse group" aria-label="Collapse Color group">▾</button>
        </nav>
        <div class="studio__pbody" data-tab-body="color"><section data-panel="color"></section></div>
        <div class="studio__pbody" data-tab-body="swatches" hidden><section data-panel="swatches"></section></div>
      </section>

      <div class="studio__gsplit" data-group-split role="separator" aria-orientation="horizontal" aria-label="Resize groups"></div>
      <section class="studio__pgroup" data-dock-group="props">
        <nav class="studio__tabs" role="tablist" aria-label="Properties">
          <button class="dk-pill" role="tab" data-tab="properties" title="Properties"><span class="ic">▤</span><span class="lb">Properties</span></button>
          <button class="dk-pill" role="tab" data-tab="adjustments" title="Adjustments"><span class="ic">◐</span><span class="lb">Adjustments</span></button>
          <button class="dk-btn studio__gtoggle" data-group-toggle title="Collapse group" aria-label="Collapse Properties group">▾</button>
        </nav>
        <div class="studio__pbody" data-tab-body="properties">
          <section data-panel="properties"></section>
          <section data-panel="layerstyles"></section>
        </div>
        <div class="studio__pbody" data-tab-body="adjustments" hidden>
          <section data-panel="adjustments"></section>
          <section data-panel="filters"></section>
        </div>
      </section>

      <div class="studio__gsplit" data-group-split role="separator" aria-orientation="horizontal" aria-label="Resize groups"></div>
      <section class="studio__pgroup" data-dock-group="layers">
        <nav class="studio__tabs" role="tablist" aria-label="Layers">
          <button class="dk-pill" role="tab" data-tab="layers" title="Layers"><span class="ic">☰</span><span class="lb">Layers</span></button>
          <button class="dk-pill" role="tab" data-tab="navigator" title="Navigator"><span class="ic">◫</span><span class="lb">Navigator</span></button>
          <button class="dk-btn studio__gmenu" data-group-menu="layers" title="Panel menu" aria-label="Layers panel menu">⋮</button>
          <button class="dk-btn studio__gtoggle" data-group-toggle title="Collapse group" aria-label="Collapse Layers group">▾</button>
        </nav>
        <div class="studio__pbody" data-tab-body="layers"><section data-panel="layers"></section></div>
        <div class="studio__pbody" data-tab-body="navigator" hidden><section data-panel="navigator"></section></div>
      </section>

      <div class="studio__gsplit" data-group-split role="separator" aria-orientation="horizontal" aria-label="Resize groups"></div>
      <section class="studio__pgroup" data-dock-group="history">
        <nav class="studio__tabs" role="tablist" aria-label="History">
          <button class="dk-pill" role="tab" data-tab="history" title="History"><span class="ic">⟲</span><span class="lb">History</span></button>
          <button class="dk-btn studio__gtoggle" data-group-toggle title="Collapse group" aria-label="Collapse History group">▾</button>
        </nav>
        <div class="studio__pbody" data-tab-body="history"><section data-panel="history"></section></div>
      </section>

      <div class="studio__gsplit" data-group-split role="separator" aria-orientation="horizontal" aria-label="Resize groups"></div>
      <section class="studio__pgroup" data-dock-group="brushes">
        <nav class="studio__tabs" role="tablist" aria-label="Brushes">
          <button class="dk-pill" role="tab" data-tab="brushes" title="Brushes"><span class="ic">✎</span><span class="lb">Brushes</span></button>
          <button class="dk-btn studio__gmenu" data-group-menu="brushes" title="Panel menu" aria-label="Brushes panel menu">⋮</button>
          <button class="dk-btn studio__gtoggle" data-group-toggle title="Collapse group" aria-label="Collapse Brushes group">▾</button>
        </nav>
        <div class="studio__pbody" data-tab-body="brushes"><section data-panel="brushes"></section></div>
      </section>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
