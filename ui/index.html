<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Art Studio</title>
  <script src="../../_kit/ducky.js"></script>
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/feedback.css">
  <link rel="stylesheet" href="panels/versions.css">
</head>
<body class="dk-page studio">
  <header class="studio__bar">
    <section data-panel="menu" class="studio__menu"></section>
    <div class="dk-row studio__docs">
      <select class="dk-input" data-doc-select aria-label="Artwork"></select>
      <button class="dk-btn" data-act="new" title="New artwork (Ctrl+N)">New</button>
      <button class="dk-btn" data-act="open" title="Open image (Ctrl+O)">Open</button>
      <button class="dk-btn" data-act="watch" aria-pressed="true" title="Watch the AI work">Watch AI</button>
    </div>
    <section data-panel="options" class="studio__options"></section>
  </header>

  <main class="studio__body">
    <aside class="dk-card studio__dock studio__dock--left">
      <section data-panel="toolbar"></section>
    </aside>

    <div class="studio__stage">
      <section data-panel="canvas" class="studio__canvas"></section>
      <div class="studio__state" data-state hidden></div>
    </div>

    <aside class="dk-card studio__dock studio__dock--right">
      <nav class="studio__tabs" role="tablist" aria-label="Panels">
        <button class="dk-pill" role="tab" data-group="paint">Paint</button>
        <button class="dk-pill" role="tab" data-group="layers">Layers</button>
        <button class="dk-pill" role="tab" data-group="team">Team</button>
      </nav>
      <div class="studio__group" data-group-body="paint">
        <section data-panel="color"></section>
        <section data-panel="swatches"></section>
        <section data-panel="brushes"></section>
      </div>
      <div class="studio__group" data-group-body="layers" hidden>
        <section data-panel="layers"></section>
        <section data-panel="history"></section>
        <section data-panel="navigator"></section>
      </div>
      <div class="studio__group" data-group-body="team" hidden>
        <section data-panel="watch" aria-label="Watch AI"></section>
        <section data-panel="live"></section>
        <section data-panel="versions"></section>
        <section data-panel="feedback"></section>
        <section data-panel="chat"></section>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
